name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: founderos
          POSTGRES_PASSWORD: founderos
          POSTGRES_DB: founderos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U founderos -d founderos"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm install --ignore-scripts
      - name: Validate database schema and migration
        env:
          PGPASSWORD: founderos
          DATABASE_URL: postgres://founderos:founderos@localhost:5432/founderos
        run: |
          psql -h localhost -U founderos -d founderos -v ON_ERROR_STOP=1 -f infra/postgres/init.sql
          npm run migrate
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
