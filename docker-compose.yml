services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: founderos
      POSTGRES_PASSWORD: founderos
      POSTGRES_DB: founderos
    ports:
      - "5432:5432"
    volumes:
      - founderos_pg:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U founderos -d founderos"]
      interval: 5s
      timeout: 3s
      retries: 10

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    environment:
      DATABASE_URL: postgres://founderos:founderos@postgres:5432/founderos
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  build-worker:
    profiles: ["build-executor"]
    build:
      context: .
      dockerfile: apps/build-worker/Dockerfile
    environment:
      DATABASE_URL: postgres://founderos:founderos@postgres:5432/founderos
      BUILD_EXECUTOR_ENABLED: "true"
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      FOUNDEROS_GITHUB_ALLOWED_REPOS: ${FOUNDEROS_GITHUB_ALLOWED_REPOS:-}
      FOUNDEROS_GITHUB_ALLOW_ANY_REPO: ${FOUNDEROS_GITHUB_ALLOW_ANY_REPO:-false}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.6-luna}
      BUILD_EXECUTION_MODEL: ${BUILD_EXECUTION_MODEL:-}
      BUILD_SANDBOX_IMAGE: ${BUILD_SANDBOX_IMAGE:-node:22-alpine}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  founderos_pg:
